<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural DSP // Criar Conta</title>
    <!-- Vincula a folha de estilo customizada original -->
    <link rel="stylesheet" href="style.css">
</head>
<!-- Classe de layout centralizado customizada -->
<body class="layout-centralizado">

    <!-- Caixa de formulário principal estilizada via CSS original -->
    <div class="caixa-login">
        <div class="logo-site">// NEURAL DSP</div>
        
        <h2>Criar Conta</h2>
        <p class="subtitulo">Entre para o futuro do processamento de áudio digital.</p>

        <!-- Formulário de cadastro processado via JavaScript -->
        <form id="formCadastro">
            <div class="campo">
                <label for="username">Nome de Usuário</label>
                <input type="text" id="username" placeholder="Ex: pedroamalfi">
            </div>

            <div class="campo">
                <label for="email">Endereço de E-mail</label>
                <input type="email" id="email" placeholder="pedro.amalfi@cps.sp.gov.br">
            </div>

            <div class="campo">
                <label for="guitarra">Guitarra / Equipamento Principal</label>
                <input type="text" id="guitarra" placeholder="Ex: Ibanez RG211, Tagima Stella...">
            </div>

            <button type="submit" class="btn-principal">Criar Conta</button>
        </form>

        <!-- Parágrafo reservado para exibição de erros via JS -->
        <p id="mensagemErro" class="feedback-erro"></p>
    </div>

    <!-- Script com as funções do projeto -->
    <script src="script.js"></script>
</body>
</html>
