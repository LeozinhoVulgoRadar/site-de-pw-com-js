<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel // Neural DSP</title>
    <!-- Importação do CDN do Bootstrap 5 usada UNICAMENTE para o card do plugin -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Vincula a folha de estilo customizada original -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar superior customizada via CSS original -->
    <header class="navbar">
        <div class="logo-site">// NEURAL DSP</div>
        
        <!-- Menu do perfil clicável para alternar telas -->
        <div class="perfil-menu" id="btnPerfil">
            <span id="navUsername" class="nav-user-name">Carregando...</span>
            <div class="avatar"></div>
        </div>
    </header>

    <main class="container animar-entrada">
        
        <!-- Seção do Menu Principal de Plugins -->
        <section id="seccaoMenu">
            <h1 class="titulo-boasvindas">Bem-vindo de volta, <span id="welcomeName">Usuário</span>.</h1>
            
            <div class="seccao-plugins">
                <h2>Plugins Adquiridos</h2>
                
                <div class="grid-plugins">
                    <!-- CARD BOOTSTRAP: Único elemento da página alterado para o Bootstrap -->
                    <div class="card bg-dark text-center border border-dashed border-secondary rounded-2" style="height: 180px;">
                        <a href="https://neuraldsp.com" target="_blank" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center link-light">
                            <span class="fs-2 text-secondary mb-1">+</span>
                            <p class="card-text text-secondary mb-0 small">Adquirir Novo Plugin</p>
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Seção de Perfil/Configurações (Oculta por padrão via CSS original) -->
        <section id="seccaoPerfil" class="oculto">
            <div class="cabecalho-perfil">
                <button id="btnVoltar" class="btn-secundario">&larr; Voltar ao Menu</button>
                <h2>Configurações de Perfil</h2>
            </div>

            <div class="detalhes-perfil">
                <div class="linha-detalhe">
                    <span class="rotulo">Nome de Usuário:</span>
                    <span class="valor" id="profUsername">---</span>
                </div>
                <div class="linha-detalhe">
                    <span class="rotulo">E-mail Registrado:</span>
                    <span class="valor" id="profEmail">---</span>
                </div>
                <div class="linha-detalhe">
                    <span class="rotulo">Equipamento Principal:</span>
                    <span class="valor" id="profGuitarra">---</span>
                </div>
            </div>
        </section>
    </main>

    <!-- Script principal de interação do sistema -->
    <script src="script.js"></script>
</body>
</html>
