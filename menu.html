<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel // Neural DSP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo-site">// NEURAL DSP</div>
        
        <div class="perfil-menu" id="btnPerfil">
            <span id="navUsername" class="nav-user-name">Carregando...</span>
            <div class="avatar"></div>
        </div>
    </header>

    <main class="container animar-entrada">
        
        <section id="seccaoMenu">
            <h1 class="titulo-boasvindas">Bem-vindo de volta, <span id="welcomeName">Usuário</span>.</h1>
            
            <div class="seccao-plugins">
                <h2>Plugins Adquiridos</h2>
                
                <div class="grid-plugins">
                    <a href="https://neuraldsp.com" target="_blank" class="cartao-plugin-vazio">
                        <span class="icone-mais">+</span>
                        <p>Adquirir Novo Plugin</p>
                    </a>
                </div>
            </div>
        </section>

        <section id="seccaoPerfil" class="oculto">
            <div class="cabecalho-perfil">
                <button id="btnVoltar" class="btn-secundario">&larr; Voltar ao Menu</button>
                <h2>Configurações de Perfil</h2>
            </div>

            <div class="detalhes-perfil">
                <div class="linha-detalhe">
                    <span class="rotulo">Nome de Usuário:</span>
                    <span class="valor" id="profUsername">---</span>
                </div>
                <div class="linha-detalhe">
                    <span class="rotulo">E-mail Registrado:</span>
                    <span class="valor" id="profEmail">---</span>
                </div>
                <div class="linha-detalhe">
                    <span class="rotulo">Equipamento Principal:</span>
                    <span class="valor" id="profGuitarra">---</span>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
